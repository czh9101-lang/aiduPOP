name: 功能建议 / Feature Request
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你的需求或痛点
      description: 你遇到了什么问题，或者希望实现什么新能力？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你期望的具体行为或设计方案
