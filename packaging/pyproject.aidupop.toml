########################################################################
# aidupop — PyPI alias distribution of hermes-lark-streaming
#
# The canonical package name on PyPI is `hermes-lark-streaming`
# (see ../pyproject.toml). This file builds the *same* source tree under
# the aidu-family brand name `aidupop`, so both of these work:
#
#     pip install hermes-lark-streaming
#     pip install aidupop
#
# Both install the identical importable package `hermes_lark_streaming`
# and share the single version source of truth: plugin.yaml.
#
# Build with: python3 scripts/build_aidupop.py
########################################################################

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidupop"
dynamic = ["version"]
description = "Hermes aiduPOP: Aidu-customized Feishu/Lark CardKit v2.0 real-time streaming cards for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jack & Dudu (aiduHER)", email = "iamjw9@gmail.com"},
]
keywords = ["feishu", "lark", "hermes", "aiduPOP", "streaming", "cardkit", "ai", "chatbot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "lark-oapi>=1.4.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/monkey2jack/aiduPOP"
Documentation = "https://github.com/monkey2jack/aiduPOP#readme"
Repository = "https://github.com/monkey2jack/aiduPOP.git"
Changelog = "https://github.com/monkey2jack/aiduPOP/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.setuptools.package-dir]
hermes_lark_streaming = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["controller*", "cardkit*", "patching*", "state*", "feishu*", "config*", "aowen*", "plugin*", "flush*"]

[tool.setuptools.package-data]
hermes_lark_streaming = ["plugin.yaml"]
