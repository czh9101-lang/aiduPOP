name: hermes-lark-streaming
version: "2.1.2"
description: "Lark (Feishu) CardKit v2.0 streaming cards for Hermes Agent — Aegis (v2.1.2) with aiduPOP customizations, real-time AI response display, typewriter effect, tool panels, and reasoning"
author: Aowen-Nowor
kind: standalone
provides_hooks:
  - pre_gateway_dispatch
  - on_feishu_normalize
  - on_message_started
  - on_message_completed
  - on_message_aborted
  - on_message_interrupted
  - on_answer_delta
  - on_thinking_delta
  - on_reasoning_delta
  - on_tool_updated
  - on_background_review_message
  - on_cron_deliver
