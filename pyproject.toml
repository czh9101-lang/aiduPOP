[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lark-streaming"
dynamic = ["version"]
description = "Lark (Feishu) CardKit v2.0 streaming cards for Hermes Agent — plugin edition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aowen-Nowor"},
]
dependencies = [
    "lark-oapi>=1.4.0",
    "PyYAML>=6.0",
]

[project.scripts]
aidupop = "hermes_lark_streaming.__main__:main"
aidupop-studio = "hermes_lark_streaming.studio.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    # Python >=3.12 的 venv 不再预置 setuptools（PEP 632 后续效应），
    # 而 tests/test_version.py::TestSetupVersion 需要 patch("setuptools.setup")。
    # 缺了它，贡献者照 CONTRIBUTING 跑 pytest 即见红（v2.4.1 审计实锤）。
    "setuptools>=68",
]

# The plugin code lives at the repo root (alongside plugin.yaml).
# When loaded as a Hermes directory plugin, the plugin loader imports
# __init__.py directly from this directory.
#
# For pip installs the repo root is mapped to the `hermes_lark_streaming`
# package. Sub-packages MUST be listed explicitly under that prefix:
# `packages.find` would collect them by their bare directory names
# (cardkit, controller, ...) and drop them at the top level of
# site-packages, where every `from ..config import X` relative import
# fails. Verified by installing the wheel into a clean venv and importing.
[tool.setuptools]
packages = [
    "hermes_lark_streaming",
    "hermes_lark_streaming.aowen",
    "hermes_lark_streaming.cardkit",
    "hermes_lark_streaming.config",
    "hermes_lark_streaming.controller",
    "hermes_lark_streaming.feishu",
    "hermes_lark_streaming.flush",
    "hermes_lark_streaming.patching",
    "hermes_lark_streaming.plugin",
    "hermes_lark_streaming.state",
    "hermes_lark_streaming.studio",
]

[tool.setuptools.package-dir]
hermes_lark_streaming = "."

[tool.setuptools.package-data]
hermes_lark_streaming = [
    "plugin.yaml",
    "studio/web/*",
    "studio/web/css/*",
    "studio/web/js/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: no pythonpath needed — conftest.py registers the repo root
# as the hermes_lark_streaming package via importlib.
asyncio_mode = "auto"
# Integration tests require HERMES_SRC_DIR (set by hermes-integration-test.yml).
# Exclude from default `pytest tests/` run to avoid 25 skipped in sync-from-gitee.
# Run explicitly: `pytest tests/integration/`
norecursedirs = ["tests/integration"]
filterwarnings = [
    # lark_oapi uses deprecated datetime.utcfromtimestamp (Python 3.12+)
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    # lark_oapi ws client calls asyncio.get_event_loop() at import time
    "ignore:There is no current event loop:DeprecationWarning",
    # v1.1.1: lark_oapi uses deprecated pkg_resources.declare_namespace
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to:DeprecationWarning",
]
