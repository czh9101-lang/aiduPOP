name: hermes-lark-streaming
version: "2.0.1"
description: "Feishu/Lark CardKit v2.0 streaming cards for Hermes Agent — Sapphire Edition (v2.0.0) with aiduPOP dudu customizations, real-time AI response display, typewriter effect, tool panels, and reasoning"
author: Aowen-Nowor
kind: standalone
provides_hooks:
  - pre_gateway_dispatch
  - on_feishu_normalize
  - on_message_started
  - on_message_completed
  - on_message_aborted
  - on_message_interrupted
  - on_answer_delta
  - on_thinking_delta
  - on_reasoning_delta
  - on_tool_updated
  - on_background_review_message
  - on_cron_deliver
